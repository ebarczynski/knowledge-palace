# Knowledge Palace Configuration

[database]
host = "localhost"
port = 5432
name = "knowledge_palace"
user = "kp"
password = "kp"

[calibre]
# Path to your Calibre Library folder (the one containing metadata.db)
#library_path = "/mnt/c/Users/barcz/Documents/Books_11052026_hp_export/Books"
library_path = "/Users/macbook/Documents/Books"

[sources]
paths = []
file_extensions = [".md", ".txt", ".org", ".rst"]

[embedding]
model = "nomic-ai/nomic-embed-text-v1.5"
provider = "auto"
dimensions = 768
# Use "cuda" for NVIDIA GPU, "mps" for Apple Silicon, "cpu" otherwise
device = "mps"
batch_size = 32

[chunking]
strategy = "semantic"
max_tokens = 512
overlap_tokens = 50
respect_headings = true

[search]
default_mode = "hybrid"
hybrid_weight_vector = 0.7
hybrid_weight_fts = 0.3
default_limit = 10

[api]
# 127.0.0.1 = local-only access (no LAN exposure). Use 0.0.0.0 to allow
# other devices on the network to reach the API.
host = "127.0.0.1"
port = 8080
