[project]
name = "knowledge-palace"
version = "0.1.0"
description = "Self-hosted personal knowledge base with semantic search, Calibre integration, and agent-accessible API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "strawberry-graphql[fastapi]>=0.260",
    # Database
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    # Embeddings & ML
    "sentence-transformers>=4.0",
    # ONNX is the preferred embedding backend (2-3x faster than PyTorch on CPU,
    # and the best available option on Apple Silicon since MLX cannot load
    # nomic_bert). optimum + onnxruntime together enable sentence-transformers'
    # `backend="onnx"`. Pin transformers to 4.x for optimum compatibility.
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.23",
    "torch>=2.5",
    "einops>=0.8",
    "numpy>=2.0",
    "transformers>=4.45,<5.0",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    # Document extraction
    "ebooklib>=0.18",
    "mobi>=0.3",
    "pymupdf>=1.25",
    # Text processing
    "tiktoken>=0.9",
    "beautifulsoup4>=4.12",
    # Utilities
    "toml>=0.10",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    # MCP server
    "mcp>=1.6",
    "pgvector>=0.4.2",
]

# No optional [project.optional-dependencies] declared.
#
# MLX acceleration for Apple Silicon is NOT provided as an installable extra
# because mlx-embeddings requires transformers>=5.0, which conflicts with the
# `optimum`/ONNX backend (transformers<5.0). MLX also cannot load the default
# nomic-embed-text model (its nomic_bert architecture is unsupported upstream).
#
# The embedding service still auto-detects MLX: if you install mlx-embeddings
# manually (`uv pip install mlx mlx-embeddings mlx-lm`) and use an
# MLX-compatible model (bert, modernbert, siglip, qwen3, ...), it will be used.
# For nomic-embed-text, ONNX Runtime is the fastest available backend.

[project.scripts]
kp = "knowledge_palace.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_palace"]
