[project]
name = "knowledge-palace"
version = "0.1.0"
description = "Self-hosted personal knowledge base with semantic search, Calibre integration, and agent-accessible API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "strawberry-graphql[fastapi]>=0.260",
    # Database
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    # Embeddings & ML
    "sentence-transformers>=4.0",
    # ONNX is the preferred embedding backend (2-3x faster than PyTorch on CPU,
    # and the best available option on Apple Silicon since MLX cannot load
    # nomic_bert). optimum + onnxruntime together enable sentence-transformers'
    # `backend="onnx"`. Pin transformers to 4.x for optimum compatibility.
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.23",
    "torch>=2.5",
    "einops>=0.8",
    "numpy>=2.0",
    "transformers>=4.45,<5.0",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    # Document extraction
    "ebooklib>=0.18",
    "mobi>=0.3",
    "pymupdf>=1.25",
    # Text processing
    "tiktoken>=0.9",
    "beautifulsoup4>=4.12",
    # Utilities
    "toml>=0.10",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    # MCP server
    "mcp>=1.6",
    "pgvector>=0.4.2",
]

# No optional [project.optional-dependencies] declared.
#
# MLX acceleration for Apple Silicon is NOT provided as an installable extra
# because mlx-embeddings requires transformers>=5.0, which conflicts with the
# `optimum`/ONNX backend (transformers<5.0). MLX also cannot load the default
# nomic-embed-text model (its nomic_bert architecture is unsupported upstream).
#
# The embedding service still auto-detects MLX: if you install mlx-embeddings
# manually (`uv pip install mlx mlx-embeddings mlx-lm`) and use an
# MLX-compatible model (bert, modernbert, siglip, qwen3, ...), it will be used.
# For nomic-embed-text, ONNX Runtime is the fastest available backend.

[dependency-groups]
# `uv sync` installs these too: tests, lint and type check are part of the project.
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-toml>=0.10",
]

[project.scripts]
kp = "knowledge_palace.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_palace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "db: needs PostgreSQL + pgvector; set KP_TEST_DATABASE_URL (tables are truncated)",
    "embedding: needs the real nomic-embed-text-v1.5 model (cached or downloadable); set KP_TEST_EMBEDDING=1",
]
# An unclosed connection, file or socket in the code under test fails the test.
filterwarnings = [
    "error::ResourceWarning",
    # Third-party noise observed on Python 3.14, not actionable from here:
    # PyMuPDF's SWIG wrapper types, and anyio's pytest plugin importing a
    # deprecated pytest alias.
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:_pytest.python.CallSpec2 has been renamed:pytest.PytestRemovedIn10Warning",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RET",  # return style
    "PIE",  # misc lints
    "RSE",  # raise style
    "PTH",  # use pathlib
    "ASYNC",# async pitfalls
    "PERF", # performance
    "PL",   # pylint (errors, warnings, refactor)
    "ARG",  # unused arguments
    "S",    # bandit-style security checks
    "TC",   # typing-only imports
    "PGH",  # pygrep hooks
    "FIX",  # unfinished code markers
]
ignore = [
    "PLR0913",    # search() takes its filters as explicit keyword arguments on purpose
    "PLR0917",
    "PLR0912",    # the pipeline's per-document decision tree is clearer in one function
    "PLR0915",
    "PLR2004",    # RRF constants and rank positions are clearer inline
    "FIX002",     # TODO-style notes are allowed in comments
    "PLC0415",    # heavy dependencies (ML stack, CLI commands) are imported lazily on purpose
    "PLW0603",    # the engine and app state are module-level singletons by design
    "B008",       # dataclasses use field(default_factory=...)
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Standalone entry points and test fixtures print and use broad excepts by design.
"evals/run_eval.py" = ["S101", "INP001"]
"tests/*" = ["S101", "S608", "PLR2004", "ARG001", "TC001", "TC002", "ASYNC109", "ASYNC240"]
"src/knowledge_palace/evalharness.py" = ["PLW1514"]
# Strawberry resolves annotations at import time to build its schema, so these
# "typing-only" imports must stay real imports.
"src/knowledge_palace/api/graphql_schema.py" = ["TC001", "TC002"]
# Classification does one stat() per document; offloading it to a thread would
# cost more than the call.
"src/knowledge_palace/ingest/pipeline.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.14"
packages = ["knowledge_palace"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = false
