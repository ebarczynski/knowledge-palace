[project]
name = "knowledge-palace"
version = "0.1.0"
description = "Self-hosted personal knowledge base with semantic search, Calibre integration, and agent-accessible API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "strawberry-graphql[fastapi]>=0.260",
    # Database
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    # Embeddings & ML
    "sentence-transformers>=4.0",
    "onnxruntime>=1.18",
    "torch>=2.5",
    "einops>=0.8",
    # Document extraction
    "ebooklib>=0.18",
    "mobi>=0.3",
    "pymupdf>=1.25",
    # Text processing
    "tiktoken>=0.9",
    "beautifulsoup4>=4.12",
    # Utilities
    "toml>=0.10",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    # MCP server
    "mcp>=1.6",
    "pgvector>=0.4.2",
]

[project.scripts]
kp = "knowledge_palace.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_palace"]
